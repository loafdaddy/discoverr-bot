services:
  discoverr:
    # Default: build from this repo (works offline / without GHCR).
    build: .
    # Optional prebuilt image (published on version tags via GitHub Actions):
    # image: ghcr.io/loafdaddy/discoverr-bot:3.2.1
    # image: ghcr.io/loafdaddy/discoverr-bot:latest
    container_name: discoverr
    env_file:
      - .env
    volumes:
      # Persist suggestion history (and keep host data/brand if present)
      - ./data:/app/data
    restart: unless-stopped
