services:
  discoverr:
    # --- Option A: build from source (default) ---
    build: .
    # --- Option B: prebuilt GitHub Packages image (see SETUP.md §6) ---
    # image: ghcr.io/loafdaddy/discoverr-bot:3.2.1
    # image: ghcr.io/loafdaddy/discoverr-bot:latest
    # Package: https://github.com/loafdaddy/discoverr-bot/pkgs/container/discoverr-bot
    container_name: discoverr
    env_file:
      - .env
    volumes:
      # Persist suggestion history (and keep host data/brand if present)
      - ./data:/app/data
    restart: unless-stopped
